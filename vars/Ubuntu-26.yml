---
# role: mariadb
# file: vars/Ubuntu-26.yml

__mariadb_packages:
  - mariadb-server
  - mariadb-client
  - python3-pymysql
__mariadb_config_file: /etc/mysql/mariadb.conf.d/99-ansible.cnf
__mariadb_datadir: /var/lib/mariadb
__mariadb_socket: /run/mysqld/mysqld.sock
__mariadb_validate_config: /usr/sbin/mariadbd --defaults-file=%s --verbose --help

__mariadb_plugin_packages:
  server_audit: []
  gssapi: [mariadb-plugin-gssapi-server]
  pam: []
