---
# role: mariadb
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    prepare: "../resources/playbooks/prepare.yml"
  inventory:
    group_vars:
      all:
        mariadb_port: 3307
        mariadb_tls_enabled: true
        mariadb_tls_cert_file: "/etc/mariadb-tls/server.crt"
        mariadb_tls_key_file: "/etc/mariadb-tls/server.key"
        mariadb_tls_ca_file: "/etc/mariadb-tls/server.crt"
        mariadb_require_secure_transport: true
        mariadb_plugins:
          - name: "server_audit"
            library: "server_audit"
            options:
              server_audit_logging: "ON"
              server_audit_events: "CONNECT,QUERY"
              server_audit_output_type: "FILE"
              server_audit_file_path: "molecule-audit.log"
          - name: "gssapi"
            library: "auth_gssapi"
            options:
              gssapi_keytab_path: "/etc/mariadb-auth/server.keytab"
              gssapi_principal_name: "mariadb/localhost@MOLECULE.TEST"
          - name: "pam"
            library: "auth_pam"
            options:
              pam_use_cleartext_plugin: "ON"
        mariadb_databases:
          - name: "application"
          - name: "obsolete"
            state: "absent"
        mariadb_users:
          - name: "application"
            password: "molecule-application-password"
            priv: "application.*:ALL"
          - name: "reader"
            password: "molecule-reader-password"
            priv:
              application.*: "SELECT"
          - name: "kerberos_application"
            plugin: "gssapi"
            plugin_hash_string: "application@MOLECULE.TEST"
            priv: "application.*:SELECT"
          - name: "pam_application"
            plugin: "pam"
            plugin_auth_string: "mysql"
            priv: "application.*:SELECT"
          - name: "obsolete"
            state: "absent"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "destroy"
  name: "default"
platforms:
  - name: "mariadb"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    capabilities:
      - "SYS_ADMIN"
      - "IPC_LOCK"
    security_opts:
      - "label=disable"
