---
# role: mariadb
# file: vars/RedHat.yml

__mariadb_packages:
  - mariadb-server
  - mariadb
  - python3-PyMySQL
__mariadb_config_file: /etc/my.cnf.d/99-ansible.cnf
__mariadb_datadir: /var/lib/mysql
__mariadb_socket: /var/lib/mysql/mysql.sock
__mariadb_validate_config: /usr/libexec/mariadbd --defaults-file=%s --verbose --help

__mariadb_plugin_packages:
  server_audit: []
  gssapi: [mariadb-gssapi-server]
  pam: [mariadb-pam]
