---
# role: mariadb
# file: tasks/assert.yml

- name: MARIADB | Require TLS configuration for encrypted transport enforcement
  ansible.builtin.assert:
    that:
      - not mariadb_require_secure_transport or mariadb_tls_enabled
    fail_msg: mariadb_require_secure_transport requires mariadb_tls_enabled.
    quiet: true

- name: MARIADB | Require certificate and key paths when configuring TLS
  ansible.builtin.assert:
    that:
      - mariadb_tls_cert_file is defined and mariadb_tls_cert_file | length > 0
      - mariadb_tls_key_file is defined and mariadb_tls_key_file | length > 0
    fail_msg: TLS requires mariadb_tls_cert_file and mariadb_tls_key_file pointing to existing PEM files.
    quiet: true
  when: mariadb_tls_enabled

- name: MARIADB | Reserve system and test databases
  ansible.builtin.assert:
    that:
      - __mariadb_database.name | lower not in ['mysql', 'sys', 'information_schema', 'performance_schema', 'test']
    fail_msg: System databases and the test database are reserved.
    quiet: true
  loop: "{{ mariadb_databases }}"
  loop_control:
    loop_var: __mariadb_database
    label: "{{ __mariadb_database.name }}"

- name: MARIADB | Require consistent application authentication
  ansible.builtin.assert:
    that:
      - __mariadb_user.name | lower not in ['', 'root', 'mysql', 'mariadb.sys']
      - >-
        __mariadb_user.state | default('present') == 'absent' or
        __mariadb_user.plugin | default(mariadb_user_plugin) != 'mysql_native_password' or
        __mariadb_user.password | default('') | length > 0
      - __mariadb_user.password is not defined or __mariadb_user.plugin | default(mariadb_user_plugin) == 'mysql_native_password'
      - __mariadb_user.plugin_auth_string is not defined or __mariadb_user.plugin_hash_string is not defined
      - >-
        __mariadb_user.password is not defined or
        (__mariadb_user.plugin_auth_string is not defined and __mariadb_user.plugin_hash_string is not defined)
    fail_msg: >-
      Application accounts must not use reserved names. Present mysql_native_password accounts require a nonempty password;
      other plugins must omit password. Specify at most one password, plugin_auth_string or plugin_hash_string.
    quiet: true
  loop: "{{ mariadb_users }}"
  loop_control:
    loop_var: __mariadb_user
    label: "{{ __mariadb_user.name }}"
  no_log: "{{ mariadb_no_log }}"
