---
# role: mariadb
# file: molecule/resources/playbooks/prepare.yml

- name: MARIADB | Generate disposable TLS fixtures on the controller
  hosts: localhost
  gather_facts: false
  vars:
    __mariadb_tls_fixture_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/tls"
  tasks:
    - name: MARIADB | Create the controller fixture directory
      ansible.builtin.file:
        path: "{{ __mariadb_tls_fixture_dir }}"
        state: directory
        mode: '0700'

    - name: MARIADB | Generate the disposable server key
      community.crypto.openssl_privatekey:
        path: "{{ __mariadb_tls_fixture_dir }}/server.key"
        type: RSA
        size: 2048
        mode: '0600'

    - name: MARIADB | Create the server certificate request
      community.crypto.openssl_csr:
        path: "{{ __mariadb_tls_fixture_dir }}/server.csr"
        privatekey_path: "{{ __mariadb_tls_fixture_dir }}/server.key"
        common_name: localhost
        subject_alt_name: ['DNS:localhost', 'IP:127.0.0.1']
        mode: '0600'

    - name: MARIADB | Sign the disposable server certificate
      community.crypto.x509_certificate:
        path: "{{ __mariadb_tls_fixture_dir }}/server.crt"
        privatekey_path: "{{ __mariadb_tls_fixture_dir }}/server.key"
        csr_path: "{{ __mariadb_tls_fixture_dir }}/server.csr"
        provider: selfsigned
        selfsigned_not_after: '+1d'
        mode: '0644'

- name: MARIADB | Prepare installation and insecure legacy fixtures
  hosts: all
  gather_facts: true
  tasks:
    - name: MARIADB | Refresh Debian package metadata from cached test images
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == 'Debian'

    - name: MARIADB | Install the default instance
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        public: true
      vars:
        mariadb_tls_enabled: false
        mariadb_require_secure_transport: false
        mariadb_databases: []
        mariadb_users: []

    - name: MARIADB | Seed databases for hardening and explicit removal
      become: true
      become_user: root
      ansible.mariadb.mariadb_db:
        login_user: root
        login_unix_socket: "{{ __mariadb_socket }}"
        config_file: ''
        name: [test, obsolete]
        state: present

    - name: MARIADB | Seed insecure and obsolete accounts
      become: true
      become_user: root
      ansible.mariadb.mariadb_user:
        login_user: root
        login_unix_socket: "{{ __mariadb_socket }}"
        config_file: ''
        name: "{{ __mariadb_fixture.name }}"
        host: "{{ __mariadb_fixture.host }}"
        state: present
      loop:
        - {name: root, host: '192.0.2.10'}
        - {name: '', host: localhost}
        - {name: '', host: '%'}
        - {name: obsolete, host: localhost}
      loop_control:
        loop_var: __mariadb_fixture
        label: "{{ __mariadb_fixture.name }}@{{ __mariadb_fixture.host }}"

    - name: MARIADB | Seed anonymous test wildcard grants
      become: true
      become_user: root
      ansible.mariadb.mariadb_query:
        login_user: root
        login_unix_socket: "{{ __mariadb_socket }}"
        config_file: ''
        query: >-
          INSERT INTO mysql.db (Host, Db, User, Select_priv)
          VALUES ('%%', %s, '', 'Y')
          ON DUPLICATE KEY UPDATE Select_priv = 'Y'
        positional_args:
          - 'test\_%'

    - name: MARIADB | Seed alternative root password authentication
      become: true
      become_user: root
      ansible.mariadb.mariadb_query:
        login_user: root
        login_unix_socket: "{{ __mariadb_socket }}"
        config_file: ''
        query: >-
          ALTER USER 'root'@'localhost' IDENTIFIED VIA unix_socket
          OR mysql_native_password USING PASSWORD('molecule-legacy-root')
      no_log: true

    - name: MARIADB | Create the server fixture directory
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/mariadb-tls
        state: directory
        owner: root
        group: mysql
        mode: '0755'

    - name: MARIADB | Install the fixture certificate
      become: true
      become_user: root
      ansible.builtin.copy:
        src: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/tls/server.crt"
        dest: /etc/mariadb-tls/server.crt
        owner: root
        group: mysql
        mode: '0644'

    - name: MARIADB | Install the fixture private key
      become: true
      become_user: root
      ansible.builtin.copy:
        src: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/tls/server.key"
        dest: /etc/mariadb-tls/server.key
        owner: root
        group: mysql
        mode: '0640'
      no_log: true
