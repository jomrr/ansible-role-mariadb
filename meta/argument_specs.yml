---
# role: mariadb
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Install and secure MariaDB.
    description:
      - Installs and starts the distribution MariaDB service with local socket administration.
      - Removes anonymous and remote root accounts, alternative root authentication, the
        test database and test grants.
      - Manages declared application databases, passwords and privileges.
    options:
      mariadb_service:
        type: str
        default: mariadb
        description:
          - Distribution service enabled and started by the role.
      mariadb_tcp_enabled:
        type: bool
        default: true
        description:
          - Enable TCP connections in addition to the distribution Unix socket. False disables
            all TCP listeners using skip-networking.
      mariadb_bind_address:
        type: str
        default: 127.0.0.1
        description:
          - Address on which MariaDB accepts TCP connections; only used when mariadb_tcp_enabled
            is true.
      mariadb_port:
        type: int
        default: 3306
        description:
          - TCP port for MariaDB clients; only used when mariadb_tcp_enabled is true.
      mariadb_tls_enabled:
        type: bool
        default: false
        description:
          - Configure TLS with existing certificate files. False leaves distribution TLS
            settings in effect.
      mariadb_tls_cert_file:
        type: path
        description:
          - Absolute path to the existing PEM server certificate and intermediate chain;
            required when TLS is enabled.
      mariadb_tls_key_file:
        type: path
        description:
          - Absolute path to the existing unencrypted PEM private key; required when TLS
            is enabled and readable by MariaDB.
      mariadb_tls_ca_file:
        type: path
        default: ''
        description:
          - Optional absolute path to an existing PEM CA bundle. Empty leaves the CA setting
            unconfigured.
      mariadb_require_secure_transport:
        type: bool
        default: false
        description:
          - Require TLS for TCP connections while allowing local Unix sockets. Requires
            mariadb_tls_enabled and MariaDB 10.5.2 or newer. False leaves the distribution
            transport policy in effect.
      mariadb_database_encoding:
        type: str
        default: utf8mb4
        description:
          - Character set for new databases without an item override.
      mariadb_plugins:
        type: list
        elements: dict
        default: []
        description:
          - Server plugins loaded from distribution plugin directories on startup. Enabled
            plugins must initialize successfully.
          - Audit, GSSAPI and PAM use distribution package defaults; other plugins may supply
            their packages explicitly.
        options:
          name:
            type: str
            required: true
            description:
              - Plugin name, for example server_audit, gssapi or pam.
          library:
            type: str
            required: true
            description:
              - Plugin library basename, for example server_audit, auth_gssapi or auth_pam,
                without a path or suffix.
          enabled:
            type: bool
            default: true
            description:
              - Load the plugin with FORCE when true; explicitly disable it with OFF when
                false.
          packages:
            type: list
            elements: str
            description:
              - Override distribution packages for this plugin. Unknown plugins default
                to no additional packages.
          options:
            type: dict
            default: {}
            description:
              - Native plugin options written to the server configuration; use MariaDB option
                names and scalar values.
      mariadb_database_collation:
        type: str
        default: utf8mb4_unicode_ci
        description:
          - Collation for new databases without an item override.
      mariadb_databases:
        type: list
        default: []
        description:
          - Application databases to create or remove; system databases and test are reserved.
        elements: dict
        options:
          name:
            type: str
            required: true
            description:
              - Database name.
          state:
            type: str
            default: present
            choices:
              - present
              - absent
            description:
              - Desired database state.
          encoding:
            type: str
            description:
              - Creation character set; defaults to mariadb_database_encoding.
          collation:
            type: str
            description:
              - Creation collation; defaults to mariadb_database_collation.
      mariadb_user_host:
        type: str
        default: localhost
        description:
          - Default host component of application accounts.
      mariadb_user_plugin:
        type: str
        default: mysql_native_password
        description:
          - Authentication plugin for accounts without an item override. The default requires
            a nonempty database password.
      mariadb_user_update_password:
        type: str
        default: always
        description:
          - Password update policy for accounts without an item override.
        choices:
          - always
          - on_create
          - on_new_username
      mariadb_user_append_privs:
        type: bool
        default: false
        description:
          - Extend existing grants instead of replacing them when true.
      mariadb_users:
        type: list
        default: []
        description:
          - Application accounts to manage; mysql_native_password accounts require nonempty
            database passwords.
          - Other authentication plugins use their native authentication strings. Root,
            mysql, mariadb.sys and anonymous accounts are reserved.
        elements: dict
        options:
          name:
            type: str
            required: true
            description:
              - Application account name.
          host:
            type: str
            description:
              - Host component; defaults to mariadb_user_host.
          password:
            type: str
            description:
              - Plaintext password, required and nonempty for present mysql_native_password
                accounts. Store with Ansible Vault.
              - Omit for other authentication plugins; password takes precedence over plugin
                selection in the upstream module.
          plugin:
            type: str
            description:
              - Authentication plugin; defaults to mariadb_user_plugin. Examples are mysql_native_password,
                gssapi and pam.
          plugin_auth_string:
            type: str
            description:
              - Native authentication string; for PAM, the service name in /etc/pam.d. Mutually
                exclusive with password and plugin_hash_string.
          plugin_hash_string:
            type: str
            description:
              - Literal authentication string passed with AS; for GSSAPI, the client principal
                including its realm. Mutually exclusive with password and plugin_auth_string.
          priv:
            type: raw
            description:
              - Privileges in module string or dictionary format. Omission preserves existing
                grants; new accounts have USAGE only.
          state:
            type: str
            default: present
            choices:
              - present
              - absent
            description:
              - Desired account state.
          update_password:
            type: str
            choices:
              - always
              - on_create
              - on_new_username
            description:
              - Password policy; defaults to mariadb_user_update_password.
          append_privs:
            type: bool
            description:
              - Grant policy; defaults to mariadb_user_append_privs.
      mariadb_no_log:
        type: bool
        default: true
        description:
          - Suppress output containing application account passwords.
